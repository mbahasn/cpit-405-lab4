
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Auto Parts - Order Form</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: white;
            margin: 8px;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 40px;
        }

        label {
            display: block;
            font-size: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: white;
        }

        input[type="date"] {
            direction: ltr;
            text-align: left;
        }

        textarea {
            height: 280px;
            resize: vertical;
        }

        input[type="submit"] {
            background-color: black;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Great Auto Parts - Order Form</h1>

        <form>

            <label for="firstName">First Name:</label>
            <input type="text"
                   id="firstName"
                   name="firstName"
                   placeholder="Enter your first name">

            <label for="lastName">Last Name:</label>
            <input type="text"
                   id="lastName"
                   name="lastName"
                   placeholder="Enter your last name">

            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address">

            <label for="phone">Phone number:</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your phone number">

            <label for="make">Make:</label>
            <input type="text"
                   id="make"
                   name="make"
                   placeholder="Make">

            <label for="model">Model:</label>
            <input type="text"
                   id="model"
                   name="model"
                   placeholder="Model">

            <label for="year">Year:</label>
            <input type="number"
                   id="year"
                   name="year"
                   placeholder="Year">

            <label for="date">Date:</label>
            <input type="date"
                   id="date"
                   name="date">

            <label for="part">Spare Part:</label>
            <input type="text"
                   id="part"
                   name="part"
                   placeholder="Enter the spare part you need">

            <label for="quantity">Quantity:</label>
            <input type="number"
                   id="quantity"
                   name="quantity"
                   min="1"
                   placeholder="Enter the quantity of the spare part you need">

            <label for="comment">Comment:</label>
            <textarea id="comment"
                      name="comment"
                      placeholder="Enter your comment"></textarea>

            <input type="submit" value="Submit">

        </form>
    </div>
</body>
</html>
